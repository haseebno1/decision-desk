<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09080d" />
    <script>
      // Apply the theme before first paint so the app never flashes the wrong
      // one. Keep in sync with src/lib/theme.ts (same key, same rules).
      (function () {
        try {
          var stored = localStorage.getItem('decision-desk.theme.v1')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) {
            meta.setAttribute('content', theme === 'light' ? '#f7f6fa' : '#09080d')
          }
          // Desktop sidebar state, so a collapsed rail never flashes open.
          // Keep in sync with src/lib/sidebar.ts.
          var sidebar = localStorage.getItem('decision-desk.sidebar.v1')
          document.documentElement.dataset.sidebar =
            sidebar === 'collapsed' ? 'collapsed' : 'expanded'
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.dataset.sidebar = 'expanded'
        }
      })()
    </script>
    <meta name="description" content="Decision Desk — think decisions through, step by step." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2309080d'/%3E%3Cpath d='M8 23V13M16 23V8M24 23v-7' stroke='%238b5cf6' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Decision Desk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
