version: 2

updates:
  # Application and tooling dependencies.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Minor and patch bumps batched into one PR; majors stay separate so they
      # can be reviewed (and migrated) on their own.
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # Keep the workflow actions current.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
